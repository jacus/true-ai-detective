[project]
name = "detective"
version = "0.1.0"
description = "A private AI detective that investigates cases over time"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ag-ui-langgraph>=0.0.47",
    "alembic>=1.20.1",
    "boto3>=1.43.120",
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.14",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "trafilatura>=2.3.1",
]

[project.scripts]
detective = "detective.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.120",
    "fpdf2>=2.8.9",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.93",
    "vcrpy>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
pythonpath = ["tests"]  # shared test helpers, e.g. known_photo

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


[tool.alembic]
# Migrations live in migrations/versions; the DB URL comes from Settings (see migrations/env.py).
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

# Keep generated migrations lint- and format-clean.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
