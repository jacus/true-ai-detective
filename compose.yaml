services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: detective
      POSTGRES_PASSWORD: detective
      POSTGRES_DB: detective
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detective -d detective"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible storage for evidence files (Railway Buckets in prod). Console on http://localhost:9001
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: detective
      RUSTFS_SECRET_KEY: detective-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data

  # The detective's web search (S13), same build as on Railway. JSON API on http://localhost:8888/search
  searxng:
    build: searxng
    environment:
      SEARXNG_SECRET: local-only-secret
    ports:
      - "8888:8080"

volumes:
  pgdata:
  s3data:
