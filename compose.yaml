services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: detective
      POSTGRES_PASSWORD: detective
      POSTGRES_DB: detective
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detective -d detective"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
